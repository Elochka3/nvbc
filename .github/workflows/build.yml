name: "Build FAP"
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with uFBT
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        id: build-fap
      - name: Upload FAP
        uses: actions/upload-artifact@v4
        with:
          name: flipper-chat-fap
          path: dist/*.fap
